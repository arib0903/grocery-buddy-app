name: AI PR Summary

on:
  pull_request:
    types: [opened]

permissions:
  models: read
  pull-requests: write
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Get changed files (Pass 1)
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(gh api \
            repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
            | jq -r '.[] | "\(.filename) | +\(.additions) -\(.deletions) | \(.status)"')
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get top 5 file diffs (Pass 2)
        id: diffs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PATCHES=$(gh api \
            repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
            | jq -r 'sort_by(.changes) | reverse | .[:5] | .[] | "### \(.filename)\n\(.patch // "(binary or no patch)")'  )
          echo "patches<<EOF" >> $GITHUB_OUTPUT
          echo "$PATCHES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call GitHub Models
        id: ai
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          FILES="${{ steps.files.outputs.files }}"
          PATCHES="${{ steps.diffs.outputs.patches }}"

          PAYLOAD=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg files "$FILES" \
            --arg patches "$PATCHES" \
            '{
              model: "openai/gpt-4o-mini",
              temperature: 0.3,
              messages: [
                {
                  role: "system",
                  content: "You are a senior software engineer reviewing a pull request. Write a clear, concise summary for the team covering: (1) what changed and why, (2) which areas of the codebase are affected, (3) any risks, edge cases, or things reviewers should pay close attention to. Use markdown with short sections. Be direct — no filler."
                },
                {
                  role: "user",
                  content: ("PR Title: " + $title + "\n\n## All Changed Files\n" + $files + "\n\n## Diffs for Top 5 Most Changed Files\n" + $patches)
                }
              ]
            }')

          RESPONSE=$(curl -s "https://models.github.ai/inference/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d "$PAYLOAD")

          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "## 🤖 AI PR Summary

          ${{ steps.ai.outputs.summary }}

          ---
          *Generated by GitHub Models · \`openai/gpt-4o-mini\`*"

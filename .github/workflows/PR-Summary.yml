name: AI PR Summary

on:
  pull_request:
    types: [opened, reopened]
    
permissions:
  models: read
  pull-requests: write
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Get changed files (Pass 1)
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
            | jq -r '.[] | .filename + " | +" + (.additions | tostring) + " -" + (.deletions | tostring) + " | " + .status' > files.txt
          echo "files<<EOF" >> $GITHUB_OUTPUT
          cat files.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Get top 5 file diffs (Pass 2)
        id: diffs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
            | jq -r 'sort_by(.changes) | reverse | .[:5] | .[] | "### " + .filename + "\n" + (.patch // "(binary or no patch)")' > patches.txt
          echo "patches<<EOF" >> $GITHUB_OUTPUT
          cat patches.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call GitHub Models
        id: ai
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          truncate -s 6000 patches.txt   # ← was 20000; keep under ~8k token limit

          PAYLOAD=$(jq -n \
            --arg title "${{ github.event.pull_request.title }}" \
            --rawfile files files.txt \
            --rawfile patches patches.txt \
            '{
              model: "openai/gpt-4o-mini",
              temperature: 0.3,
              messages: [
                {
                  role: "system",
                  content: "You are a senior software engineer reviewing a pull request. Write a clear, concise summary covering: (1) what changed and why, (2) which areas of the codebase are affected, (3) any risks or things reviewers should pay close attention to. Use markdown with short sections. Be direct."
                },
                {
                  role: "user",
                  content: ("PR Title: " + $title + "\n\n## All Changed Files\n" + $files + "\n\n## Diffs for Top 5 Most Changed Files\n" + $patches)
                }
              ]
            }')

          RESPONSE=$(curl -s "https://models.github.ai/inference/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d "$PAYLOAD")

          echo "API Response: $RESPONSE"

          #check for error before parsing
          if echo "$RESPONSE" | jq -e '.error' > /dev/null 2>&1; then
            echo "GitHub Models API error: $(echo "$RESPONSE" | jq -r '.error.message')" >&2
            exit 1
          fi

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > summary.txt
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          cat summary.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SUMMARY=$(cat summary.txt)
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "## 🤖 AI PR Summary

          ${SUMMARY}

          ---
          *Generated by GitHub Models · \`openai/gpt-4o-mini\`*"
